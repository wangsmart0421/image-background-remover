name = "bg-remover-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# 环境变量
MAX_FILE_SIZE = "10485760"  # 10MB
ALLOWED_ORIGINS = "https://your-domain.pages.dev,http://localhost:3000"

# 重要：在生产环境中通过 Cloudflare Dashboard 设置 REMOVEBG_API_KEY
# REMOVEBG_API_KEY = "your_removebg_api_key_here"

[env.production]
zone_id = "your_zone_id_here"
routes = [
  { pattern = "api.your-domain.com/*", custom_domain = true }
]

[env.staging]
routes = [
  { pattern = "staging-api.your-domain.com/*", custom_domain = true }
]

# 部署配置
[deployment]
environments = ["production", "staging"]

# 日志配置
[logpush]
enabled = true
dataset = "workers"

# 限制配置
[limits]
cpu_ms = 50  # 最大CPU时间（毫秒）

# 触发器配置
[triggers]
crons = []  # 定时任务（可选）